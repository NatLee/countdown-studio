name: CI

# Every pull request: lint, type-check, test and build, and check that the
# Docker image still builds and serves the page.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start with docker compose
        run: PORT=8000 docker compose up --build --detach --wait
      - name: The page and its assets are served
        run: |
          page=$(curl --fail --silent --show-error --retry 5 --retry-connrefused http://localhost:8000/)
          echo "$page" | grep -q '<title>Countdown Studio</title>'
          script=$(echo "$page" | grep -o 'assets/index-[^"]*\.js' | head -n 1)
          curl --fail --silent --show-error --output /dev/null "http://localhost:8000/$script"
      - name: Stop
        if: always()
        run: docker compose down
